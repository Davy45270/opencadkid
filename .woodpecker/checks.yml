# Local CI (Woodpecker): the "checks" job of .github/workflows/ci.yml, same commands, same order, plus the "assets"
# step (image budgets), which the GitHub mirror does not run.
# Node: the official node:26 image (.nvmrc says 26), through the Harbor Docker Hub proxy, pulled on every run
# like setup-node resolving "24". The build step also prints the fingerprint of dist/: the publication script
# rebuilds the same commit and refuses to publish a different tree.
# On tank01 (4 CPU per step, like the 4-vCPU GitHub runners): on the 2-CPU Contabo agent, five Vitest
# tests went past their 5 s timeout.
labels:
  host: tank01

when:
  - event: push
    branch: main
  - event: [pull_request, manual]

steps:
  - name: npm ci
    image: &node harbor.pingfr.duckdns.org/dockerhub/library/node:26
    pull: true
    commands:
      - node --version
      - npm ci
  - name: lint
    image: *node
    commands:
      - npm run lint
  - name: assets
    image: *node
    commands:
      # Image budgets of assets-budget.json (pure Node, no system tool), then the tests of the check itself.
      - npm run assets -- check
      - node --test scripts/test-assets.js
  - name: typecheck
    image: *node
    commands:
      - npm run typecheck
  - name: test
    image: *node
    commands:
      - npm test
  - name: build
    image: *node
    commands:
      - npm run build
      - sha256sum dist/index.html
      - echo "empreinte dist $(cd dist && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-64)"
  - name: check:precache
    image: *node
    commands:
      - npm run check:precache
  - name: test:impact
    image: *node
    commands:
      - npm run test:impact
