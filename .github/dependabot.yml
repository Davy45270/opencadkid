version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Ignored at the ecosystem level, so it also applies to grouped updates (« outillage »):
    # typescript-eslint 8 supports typescript >=4.8.4 <6.1.0, a major TypeScript breaks npm ci.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      outillage:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
